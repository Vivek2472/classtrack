<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Maintenance</title>
    <style>
        /* Basic Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 2rem;
        }

        p {
            line-height: 1.6;
            color: #666;
            margin-bottom: 20px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .contact-info {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #888;
        }

        .contact-info a {
            color: #007bff;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        /* Simple animation for the gear icon */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spin-animation {
            display: inline-block;
            animation: spin 4s linear infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Unicode Gear Icon -->
        <span class="icon spin-animation">⚙️</span>
        
        <h1>We'll be back soon!</h1>
        
        <p>
            Sorry for the inconvenience. We’re performing some maintenance at the moment. 
            We should be back online shortly.
        </p>

        <div class="contact-info">
            <p>Need to reach us urgently? Email us at <a href="mailto:support@example.com">support@example.com</a></p>
        </div>
    </div>

</body>
</html>
